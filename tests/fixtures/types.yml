# Test types — safe to delete along with the entire tests/ directory.

user:
  name*: string
  email*: email
  role: string, default=user

article:
  title*: string
  body: richtext
  published: boolean, default=false
  author: -> user
  tags: -> tag[]
  featured_image: file, public=true
  document: file
  $derived(slug): slugify
  $derived(reading_time): reading_time

page:
  title*: string
  slug: string

tag:
  name*: string
